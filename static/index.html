<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>课堂涂格白板服务</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #1f2937; }
    header { background: #1e3a8a; color: white; padding: 18px 28px; }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; opacity: .85; font-size: 14px; }
    main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px 24px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 16px; }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; margin: 8px 0 4px; color: #374151; }
    input, select, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: 7px 9px; font-size: 13px; }
    textarea { min-height: 86px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: #2563eb; color: white; cursor: pointer; font-size: 13px; margin: 4px 6px 4px 0; }
    button.secondary { background: #4b5563; }
    button.good { background: #059669; }
    button:hover { filter: brightness(.95); }
    .board-wrap { overflow: auto; padding: 8px; background: #f9fafb; border-radius: 10px; }
    .grid { display: grid; gap: 0; width: max-content; }
    .cell { width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 1px dashed #cbd5e1; background: white; box-sizing: border-box; }
    .cell.wall-right { border-right: 5px solid #111827; }
    .cell.wall-bottom { border-bottom: 5px solid #111827; }
    .cell.blue { background: #3b82f6; color: white; border-color: #1d4ed8; }
    pre { background: #0f172a; color: #dbeafe; padding: 12px; border-radius: 10px; overflow: auto; max-height: 430px; font-size: 12px; }
    .muted { color: #6b7280; font-size: 12px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; background: #dbeafe; color: #1e40af; font-size: 12px; margin-left: 6px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>课堂涂格白板服务</h1>
  <p>分组预览 · 挡线连通 · 照样贴图 / 重演笔法 · 教案约束下的最高总分合班</p>
</header>
<main>
  <section>
    <div class="card">
      <h2>1. 开课</h2>
      <label>课节 ID（可留空）</label>
      <input id="sid" placeholder="例如 patch_lesson" />
      <div class="row">
        <div><label>约定</label><select id="convention"><option value="patch">照样贴图 patch</option><option value="replay">重演笔法 replay</option></select></div>
        <div><label>棋盘</label><div class="row"><input id="rows" type="number" min="1" max="5" value="1"/><input id="cols" type="number" min="1" max="5" value="3"/></div></div>
      </div>
      <label><input id="presetWall" type="checkbox" checked style="width:auto"/> 三格示例：第二、三格间有挡线</label>
      <button onclick="createClass()">创建课节并取得当前总板</button>
      <button class="secondary" onclick="loadScenario()">填入三格请求</button>
    </div>

    <div class="card">
      <h2>2. 小组与稿件</h2>
      <label>小组 ID / 名称</label>
      <div class="row"><input id="gid" placeholder="jia_group"/><input id="gname" placeholder="甲组"/></div>
      <button onclick="createGroup()">从当前总板分小组</button>
      <label>操作 steps（预览不会改老师总板）</label>
      <textarea id="steps">[{"op":"paint","at":[0,0],"color":"blue"}]</textarea>
      <button class="secondary" onclick="preview()">预览</button>
      <button class="good" onclick="submitDraft()">作为稿件交给老师</button>
      <div class="row">
        <div><label>稿件 ID</label><input id="did" placeholder="jia"/></div>
        <div><label>分值</label><input id="score" type="number" value="5"/></div>
      </div>
    </div>

    <div class="card">
      <h2>3. 教案禁令与合班</h2>
      <label>禁色规则：格 r,c 不得为 color</label>
      <div class="row">
        <input id="banCell" placeholder="0,2" value="0,2"/>
        <input id="banColor" placeholder="blue" value="blue"/>
      </div>
      <button class="secondary" onclick="banColor()">添加禁色</button>
      <label>重演顺序 JSON（可留空，表示枚举合法顺序）</label>
      <input id="order" placeholder='["yi","jia"]'/>
      <button onclick="plan()">计算最高总分方案</button>
      <button class="good" onclick="publish()">签字发表最优方案</button>
      <p class="muted">服务会持久化到 <code>WHITEBOARD_DATA</code>；重启后可用新的老师会话核对。</p>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>当前白板 <span id="boardTitle" class="pill">尚未载入</span></h2>
      <div id="board" class="board-wrap"><p class="muted">创建课节后在此渲染。</p></div>
    </div>
    <div class="card">
      <h2>响应 / 讲解</h2>
      <pre id="out">等待请求……</pre>
    </div>
  </section>
</main>

<script>
let classData = null;
let lastBoard = null;

function show(value) {
  document.getElementById('out').textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  const text = await resp.text();
  const data = text ? JSON.parse(text) : {};
  if (!resp.ok) throw new Error(data.message || text);
  return data;
}
function currentSid() { return document.getElementById('sid').value.trim(); }
function renderBoard(board) {
  lastBoard = board;
  document.getElementById('boardTitle').textContent = board.board_id || 'preview';
  const host = document.getElementById('board');
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `repeat(${board.cols}, 74px)`;
  for (let r=0; r<board.rows; r++) {
    for (let c=0; c<board.cols; c++) {
      const cell = document.createElement('div');
      const color = board.cells[r][c];
      cell.className = 'cell' + (color === 'blue' ? ' blue' : '');
      const rightKey = `${r},${c}|${r},${c+1}`;
      const bottomKey = `${r},${c}|${r+1},${c}`;
      if (board.walls && board.walls[rightKey]) cell.classList.add('wall-right');
      if (board.walls && board.walls[bottomKey]) cell.classList.add('wall-bottom');
      cell.textContent = `${r},${c}`;
      cell.title = color;
      grid.appendChild(cell);
    }
  }
  host.innerHTML = '';
  host.appendChild(grid);
}
function loadScenario() {
  document.getElementById('sid').value = 'demo_' + Math.random().toString(16).slice(2,7);
  document.getElementById('convention').value = 'patch';
  document.getElementById('rows').value = 1;
  document.getElementById('cols').value = 3;
  document.getElementById('presetWall').checked = true;
  document.getElementById('gid').value = 'jia_group';
  document.getElementById('gname').value = '甲组';
  document.getElementById('did').value = 'jia';
  document.getElementById('score').value = 5;
  document.getElementById('steps').value = JSON.stringify([{op:'paint',at:[0,0],color:'blue'}], null, 2);
}
async function createClass() {
  try {
    const walls = document.getElementById('presetWall').checked ? [[[0,1],[0,2]]] : [];
    const body = {
      title: '浏览器课堂',
      convention: document.getElementById('convention').value,
      rows: Number(document.getElementById('rows').value),
      cols: Number(document.getElementById('cols').value),
      walls
    };
    const id = currentSid(); if (id) body.id = id;
    classData = await api('POST', '/api/sessions', body);
    document.getElementById('sid').value = classData.id;
    renderBoard(classData.current_board);
    show(classData);
  } catch (e) { show(String(e)); }
}
async function createGroup() {
  try {
    const sid = currentSid();
    const body = {id: document.getElementById('gid').value.trim(), name: document.getElementById('gname').value};
    const g = await api('POST', `/api/sessions/${sid}/groups`, body);
    renderBoard(g.board); show(g);
  } catch (e) { show(String(e)); }
}
function readSteps() { return JSON.parse(document.getElementById('steps').value); }
async function preview() {
  try {
    const gid = document.getElementById('gid').value.trim();
    const result = await api('POST', `/api/groups/${gid}/preview`, {steps: readSteps()});
    renderBoard(result.preview_board); show(result);
  } catch (e) { show(String(e)); }
}
async function submitDraft() {
  try {
    const sid = currentSid(), gid = document.getElementById('gid').value.trim();
    const body = {
      id: document.getElementById('did').value.trim(),
      group_id: gid,
      score: Number(document.getElementById('score').value),
      steps: readSteps()
    };
    const d = await api('POST', `/api/sessions/${sid}/drafts`, body);
    renderBoard(d.preview_board); show(d);
  } catch (e) { show(String(e)); }
}
async function banColor() {
  try {
    const sid = currentSid();
    const cell = document.getElementById('banCell').value.split(',').map(x => Number(x.trim()));
    const color = document.getElementById('banColor').value.trim();
    const lesson = await api('PATCH', `/api/sessions/${sid}/lesson`, {forbidden: [{cell, color}]});
    show(lesson);
  } catch (e) { show(String(e)); }
}
function planBody() {
  const orderText = document.getElementById('order').value.trim();
  return orderText ? {order: JSON.parse(orderText)} : {};
}
async function plan() {
  try {
    const sid = currentSid();
    const result = await api('POST', `/api/sessions/${sid}/merge/plan`, planBody());
    if (result.best) renderBoard(result.best.board);
    show(result);
  } catch (e) { show(String(e)); }
}
async function publish() {
  try {
    const sid = currentSid();
    const result = await api('POST', `/api/sessions/${sid}/merge/publish`, planBody());
    renderBoard(result.published_board);
    classData = await api('GET', `/api/sessions/${sid}`);
    show(result);
  } catch (e) { show(String(e)); }
}
api('GET','/health').then(show).catch(show);
</script>
</body>
</html>
