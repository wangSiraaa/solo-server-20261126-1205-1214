[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sofa-delivery-service"
version = "1.0.0"
description = "Grid-simulated custom sofa delivery and assembly order service"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["sofa_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
